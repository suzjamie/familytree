  .leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}

  .leaflet-container{background:#ddd;outline-offset:1px;font:12px/1.5 sans-serif}

  .leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}

  .leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;pointer-events:auto;transform:rotate(45deg)}

  .leaflet-touch .leaflet-control-attribution,.leaflet-touch .leaflet-bar{box-shadow:none}

  /* ---- Page styling: tokens and layout matched to suzfamilytree.net ---- */
  :root{
    --bg:#fff; --card:#f4f6f6; --ink:#1d2127; --dim:#5b6570; --line:#d5dade;
    --slate:#3b4149; --steel:#2f5d8c; --blue:#5a7a9a; --rose:#a37a86;
    --shadow:0 1px 3px rgba(30,40,50,.14);
    --head:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
    --geo:"Jura","Segoe UI",system-ui,sans-serif;
    --body:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1b1d21; --card:#24272c; --ink:#e7e9ea; --dim:#9aa3ac; --line:#3a3f46;
      --slate:#c3c9d1; --steel:#7fa6d6; --blue:#8aa6bf; --rose:#c79aa4;
      --shadow:0 1px 3px rgba(0,0,0,.4);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1b1d21; --card:#24272c; --ink:#e7e9ea; --dim:#9aa3ac; --line:#3a3f46;
    --slate:#c3c9d1; --steel:#7fa6d6; --blue:#8aa6bf; --rose:#c79aa4;
    --shadow:0 1px 3px rgba(0,0,0,.4);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--body);
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));
  }
  .wrap{max-width:1180px;margin:0 auto;padding-block:2.2rem 3rem}
  header{margin-bottom:1.6rem}
  h1{
    font:500 2.3rem/1.15 var(--geo);margin:.2rem 0 .4rem;letter-spacing:.01em;color:var(--slate);
    text-wrap:balance;
  }
  .sub{color:var(--dim);font-size:1.08rem;margin:.1rem 0 1rem}
  main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:1.6rem;align-items:start}
  @media (max-width:820px){ main{grid-template-columns:1fr} }
  .mapcard{
    background:var(--card);border:1px solid var(--line);border-radius:3px;box-shadow:var(--shadow);
    padding:1rem 1rem 1.3rem;min-width:0;
  }
  #map{width:100%;aspect-ratio:4/3;border-radius:3px;background:var(--card)}
  @media (max-width:820px){ #map{aspect-ratio:1/1} }

  /* custom marker + popup skin, in the site's own palette */
  .vpin{
    display:flex;align-items:center;justify-content:center;border-radius:50%;
    background:color-mix(in srgb, var(--slate) 82%, var(--rose) 0%);
    border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);
    color:#fff;font:700 .68rem var(--body);cursor:pointer;
  }
  .vpin.big{background:var(--rose)}
  .leaflet-popup-content-wrapper{background:var(--card);color:var(--ink);border-radius:3px;box-shadow:var(--shadow)}
  .leaflet-popup-tip{background:var(--card);box-shadow:var(--shadow)}
  .leaflet-popup-content{font-family:var(--body);margin:.7rem .9rem}
  .leaflet-popup-content b{font:700 .95rem var(--geo);color:var(--slate);display:block;margin-bottom:.2rem}
  .leaflet-popup-content .n{font-size:.84rem;color:var(--dim);line-height:1.45}
  .leaflet-popup-close-button{color:var(--dim)!important}
  .leaflet-popup-close-button:hover{color:var(--ink)!important}
  .leaflet-bar a{background:var(--card);color:var(--slate);border-bottom:1px solid var(--line)}
  .leaflet-bar a:hover{background:var(--bg)}
  .leaflet-bar{box-shadow:var(--shadow)}
  .leaflet-control-attribution{background:color-mix(in srgb, var(--bg) 88%, transparent)!important;color:var(--dim);font:.68rem var(--body)}
  .leaflet-control-attribution a{color:var(--dim)}

  .caption{margin-top:.7rem;font-size:.74rem;color:var(--dim);line-height:1.45}
  .side{
    background:var(--card);border:1px solid var(--line);border-radius:3px;box-shadow:var(--shadow);
    padding:1rem 1.1rem 1.2rem;min-width:0;
  }
  .side h2{font:700 1.05rem var(--geo);margin:0 0 .7rem;color:var(--slate);letter-spacing:.01em}
  .list{max-height:560px;overflow-y:auto;display:flex;flex-direction:column;gap:.1rem;margin:0 -.3rem;padding-right:.2rem}
  .row{
    display:flex;gap:.6rem;align-items:flex-start;padding:.5rem .5rem;border-radius:3px;
    cursor:pointer;border:1px solid transparent;
  }
  .row:hover,.row.active{background:color-mix(in srgb, var(--steel) 8%, transparent);border-color:color-mix(in srgb, var(--steel) 20%, transparent)}
  .row .w{
    flex:0 0 auto;min-width:1.6rem;height:1.6rem;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font:700 .72rem var(--body);background:color-mix(in srgb, var(--slate) 14%, var(--card));color:var(--slate);
  }
  .row .meta{min-width:0}
  .row .addr{font-weight:600;font-size:.86rem;color:var(--ink)}
  .row .note{color:var(--dim);font-size:.78rem;line-height:1.4}
  .list::-webkit-scrollbar{width:8px}
  .list::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .backlink{display:inline-block;margin-top:1.4rem;font:600 .85rem var(--body);color:var(--slate);
    text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
  .backlink:hover{color:var(--steel)}
</style>

<div class="wrap">
  <header>
    <h1>Family in Vienna, Austria</h1>
    <p class="sub">Each pin marks a place the family lived, worked, worshipped, or is buried — sized by how many people were there. Click a pin, or a place in the list, for who and when.</p>
  </header>

  <main>
    <div class="mapcard">
      <div id="map"></div>
      <p class="caption">Map data &amp; imagery &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors.</p>
    </div>

    <div class="side">
      <h2>36 places, sorted by weight</h2>
      <div class="list" id="list"></div>
    </div>
  </main>
  <a class="backlink" href="/places.html">&larr; Back to Places</a>
</div>

<script>
(function(){
  var points = [
    {addr:"Johannesgasse 12, 1010", lat:48.2039877, lng:16.3744633, w:1, note:"Ernst Blau — lived 1955, 1965"},
    {addr:"Förstergasse 7, 1020", lat:48.220907, lng:16.3723986, w:1, note:"Edith Weiss — lived 1942"},
    {addr:"Heinestraße 12, 1020", lat:48.2210573, lng:16.3841957, w:1, note:"Richard Blau — lived 1938"},
    {addr:"Leopoldsgasse 3, 1020", lat:48.2213072, lng:16.3750016, w:1, note:"Ernestine Blau — education 1891"},
    {addr:"Lichtenauergasse 7, 1020", lat:48.2147297, lng:16.3892279, w:1, note:"Heinrich Blau — lived 1937"},
    {addr:"Novaragasse 12, 1020", lat:48.219298, lng:16.3827959, w:4, note:"Josef 'Joshi' Blau, Richard Blau, Grete Stör — Nazi persecution 1938; Scheindel 'Charlotte' Klinghoffer — lived 1914"},
    {addr:"Pillersdorfgasse 10, Apt 5, 1020", lat:48.2201127, lng:16.3852834, w:3, note:"Ernestine Blau, Hildegard 'Hilde' Weiss, Robert Weiss — lived 1926–1938"},
    {addr:"Schweidlgasse 13, 1020", lat:48.2260149, lng:16.3880125, w:5, note:"Richard Blau — lived 1941; Edmund, Oscar & Walter Blau, Juliana Oszman — lived 1938"},
    {addr:"Zirkusgasse 19, 1020", lat:48.2161206, lng:16.3839164, w:1, note:"Josef Blau — lived 1941"},
    {addr:"Hanovergasse 8, 1020", lat:48.2301156, lng:16.3696237, w:7, note:"Clara, Jacob, Jochil & Joseph Elliot Hecht, Sadie Hecht, Adele Schapira — lived 1905; Maximilian Hecht — born/died 1905–06"},
    {addr:"Kleine Pfarrgasse 29, 1020", lat:48.2195274, lng:16.3788987, w:8, note:"Edmund, Ernestine, Heinrich, Oskar, Richard & Samuel Blau, Betti Borbola Fuchs — 1891–1894"},
    {addr:"Othmargasse 44, 1020", lat:48.2310274, lng:16.369481, w:2, note:"Jochil Hecht, Rose Hecht — lived 1928–1938"},
    {addr:"Taborstraße 49, 1020", lat:48.2207074, lng:16.3815292, w:2, note:"Ernestine Blau, Jakab Weisz — lived 1899"},
    {addr:"Löwengasse 19, 1030", lat:48.2100144, lng:16.3912308, w:4, note:"Erika & Ilonka 'Helen' Blau, Josef Blau, Teresa Feldman — lived 1926–1940"},
    {addr:"Fillgradergasse 15, Apt 5, 1060", lat:48.1992404, lng:16.357717, w:1, note:"Robert Weiss — lived 1932–1939; Nazi persecution 1938–1939"},
    {addr:"Schmalzhofgasse 3, 1060", lat:48.1956142, lng:16.3474375, w:1, note:"Richard Blau — married 1930"},
    {addr:"Seegasse 9, 1090", lat:48.2234319, lng:16.3635571, w:1, note:"Anna Maria Schepan — lived 1964"},
    {addr:"Wilhelminenspital, 1160", lat:48.2123251, lng:16.3011863, w:1, note:"Gertrude Blau — died 1927"},
    {addr:"Dürauergasse 9, 1170", lat:48.223502, lng:16.3076265, w:1, note:"Kurt Blau — died 1976"},
    {addr:"Donaustraße 12, 1190", lat:48.2875695, lng:16.3459188, w:3, note:"Erika Blau, Ernst Blau, Anna Maria Schepan — lived 1946"},
    {addr:"Friedrich-Engels-Platz 9, 1200", lat:48.2465768, lng:16.3787618, w:4, note:"Edmund & Walter Blau, Oscar Blau, Juliana Oszman — lived 1934–1938; Nazi persecution 1938"},
    {addr:"Hirschvogelgasse 3, 1200", lat:48.2303843, lng:16.3644212, w:8, note:"Clara, Jacob, Jochil & Joseph Elliot Hecht, Rose & Sadie Hecht, Adele Schapira — lived 1910; Sigfried 'Fred' Hecht born 1910"},
    {addr:"Rauscherstraße 6, Apt 23, 1200", lat:48.2303991, lng:16.3756611, w:16, note:"The Blau family home, 1914–1940: Edmund, Erika, Ernst, Gertrude, Hermine 'Mina', Josef 'Joshi', Kurt, Oskar, Richard, Rosa, Samuel, Siegfried & Walter Blau, Betti Borbola Fuchs, Scheindel Klinghoffer, Anna Maria Schepan"},
    {addr:"Romanogasse 12, 1200", lat:48.2320968, lng:16.3644859, w:7, note:"Clara, Jacob, Jochil & Joseph Elliot Hecht, Sadie Hecht, Adele Schapira — lived 1908; Rose Hecht born 1908"},
    {addr:"Treustraße 26, 1200", lat:48.2288357, lng:16.366595, w:1, note:"Anna Maria Schepan — lived 1940–1950"},
    {addr:"Fünfhaus Synagogue (Turnertempel), 1150", lat:48.192292, lng:16.3352708, w:1, note:"Robert Weiss — occupation 1934–1938"},
    {addr:"Gymnasium Kundmanngasse, 1030", lat:48.2035786, lng:16.393738, w:1, note:"Robert Weiss — education 1916–1922"},
    {addr:"Kaufmännisches Spital, 1190", lat:48.2380933, lng:16.330722, w:2, note:"Ernestine Blau, Oskar Blau — died 1931"},
    {addr:"Leopoldstädter Tempel, 1020", lat:48.2137804, lng:16.3852687, w:5, note:"Heinrich, Josef 'Joshi' & Richard Blau, Scheindel Klinghoffer, Grete Stör — married 1914–1938"},
    {addr:"Polish Synagogue, 1020", lat:48.2183664, lng:16.3774173, w:2, note:"Ernestine Blau, Jakab Weisz — married 1899"},
    {addr:"Stadttempel, 1010", lat:48.2116667, lng:16.3747222, w:6, note:"Edmund & Oskar Blau, Rose Hecht, Juliana Oszman, Anna Maria Schepan, Robert Weiss — married/occupation 1914–1939"},
    {addr:"Rothschild Jewish Hospital, 1180", lat:48.2263694, lng:16.3487578, w:1, note:"Adele Schapira — died 1928"},
    {addr:"University of Vienna", lat:48.2131702, lng:16.3598848, w:1, note:"Robert Weiss — graduated 1931"},
    {addr:"Academy for Music and Performing Arts, 1030", lat:48.2018433, lng:16.3848833, w:1, note:"Robert Weiss — graduated 1933"},
    {addr:"Zentralfriedhof Tor I (old Jewish cemetery), 1110", lat:48.1567179, lng:16.4315541, w:3, note:"Hermine Blau, Rosa Blau, Maximilian Hecht — buried 1885–1917"},
    {addr:"Zentralfriedhof Tor IV (new Jewish cemetery), 1110", lat:48.1518716, lng:16.4513235, w:10, note:"Ernestine, Oskar & Samuel Blau, Gertrude Blau, Heinrich Blau, Kurt Blau, Siegfried Blau, Betti Borbola Fuchs, Scheindel Klinghoffer, Adele Schapira — buried 1927–1976"}
  ];

  var maxW = Math.max.apply(null, points.map(function(p){return p.w;}));

  function startMap(){
    var map = L.map('map', { scrollWheelZoom:false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: ''
    }).addTo(map);

    var bounds = L.latLngBounds(points.map(function(p){ return [p.lat,p.lng]; }));
    map.fitBounds(bounds, {padding:[24,24]});

    var markers = [];
    points.forEach(function(p, idx){
      var size = Math.round(16 + 16*Math.sqrt(p.w/maxW));
      var icon = L.divIcon({
        className: '',
        html: '<div class="vpin'+(p.w>=maxW*0.5?' big':'')+'" style="width:'+size+'px;height:'+size+'px;font-size:'+Math.max(9,Math.round(size*0.42))+'px">'+p.w+'</div>',
        iconSize: [size,size],
        iconAnchor: [size/2, size/2],
        popupAnchor: [0, -size/2]
      });
      var m = L.marker([p.lat, p.lng], { icon: icon }).addTo(map);
      m.bindPopup('<b>'+p.addr+'</b><span class="n">'+p.note+'</span>');
      m.on('click', function(){ highlight(idx); });
      markers.push(m);
    });

    window.addEventListener('resize', function(){ map.invalidateSize(); });

    function highlight(idx){
      document.querySelectorAll('.row').forEach(function(r){ r.classList.remove('active'); });
      var row = list.querySelector('.row[data-idx="'+idx+'"]');
      if (row){ row.classList.add('active'); row.scrollIntoView({block:'nearest'}); }
    }

    // --- sidebar list ---
    var list = document.getElementById('list');
    points
      .map(function(p,idx){ return {p:p, idx:idx}; })
      .sort(function(a,b){ return b.p.w - a.p.w; })
      .forEach(function(entry){
        var row = document.createElement('div');
        row.className='row'; row.dataset.idx = entry.idx;
        row.innerHTML = '<span class="w">'+entry.p.w+'</span>'+
          '<span class="meta"><span class="addr">'+entry.p.addr+'</span>'+
          '<span class="note">'+entry.p.note+'</span></span>';
        row.addEventListener('click', function(){
          map.flyTo([entry.p.lat, entry.p.lng], Math.max(map.getZoom(),15), {duration:.6});
          markers[entry.idx].openPopup();
          highlight(entry.idx);
        });
        list.appendChild(row);
      });
  }

  if (window.L) startMap();
  else {
    var s = document.querySelector('script[src*="leaflet"]');
    if (s) s.addEventListener('load', startMap);
  }
})();
</script>
