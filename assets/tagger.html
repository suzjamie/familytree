<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo tagger</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1d2127;background:#f4f6f6;height:100vh;display:flex;flex-direction:column}
header{background:#3b4149;color:#fff;padding:.6rem 1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
header h1{font-size:1.1rem;margin:0;font-weight:600}
header .sp{flex:1}
button,select,input{font:inherit}
.btn{background:#2f5d8c;color:#fff;border:0;border-radius:4px;padding:.4rem .8rem;cursor:pointer}
.btn.alt{background:#fff;color:#1d2127;border:1px solid #c5ccd2}
.btn:disabled{opacity:.45;cursor:default}
#state{font-size:.85rem;opacity:.9}
#state.dirty{color:#ffd37a;opacity:1}
main{flex:1;display:flex;min-height:0}
aside{width:300px;border-right:1px solid #d5dade;background:#fff;display:flex;flex-direction:column;min-height:0}
aside .bar{padding:.5rem;display:flex;flex-direction:column;gap:.4rem;border-bottom:1px solid #e3e7ea}
aside input,aside select{width:100%;padding:.35rem .5rem;border:1px solid #c5ccd2;border-radius:4px}
#list{overflow:auto;flex:1}
.it{display:flex;gap:.6rem;align-items:center;padding:.4rem .6rem;border-bottom:1px solid #eef1f3;cursor:pointer}
.it:hover{background:#f1f5f9}
.it.cur{background:#e3edf7}
.it img{width:54px;height:54px;object-fit:cover;border-radius:3px;flex:none;background:#dde2e6}
.it .t{min-width:0;font-size:.85rem}
.it .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .t span{color:#5b6570;font-size:.78rem}
.it .n{margin-left:auto;font-size:.78rem;background:#2a7a4b;color:#fff;border-radius:999px;padding:0 .5rem;flex:none}
section{flex:1;min-width:0;overflow:auto;padding:1rem}
#help{color:#5b6570;margin:0 0 .6rem}
.nav{display:flex;gap:.5rem;align-items:center;margin-bottom:.6rem;flex-wrap:wrap}
#title{font-weight:600}
#stage{position:relative;display:inline-block;max-width:100%;line-height:0;cursor:crosshair;user-select:none;-webkit-user-select:none}
#stage img{max-width:100%;max-height:calc(100vh - 230px);width:auto;height:auto;display:block}
.mk{position:absolute;transform:translate(-50%,-50%);aspect-ratio:1/1;min-width:20px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1.5px rgba(0,0,0,.6);cursor:pointer;line-height:1}
.mk.draft{pointer-events:none;border-style:dashed}
.mk.hot{background:rgba(255,220,100,.45)}
.mk .lab{position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#1d2127;color:#fff;font-size:.8rem;line-height:1.3;padding:.15rem .45rem;border-radius:3px;z-index:3}
.pop{position:absolute;z-index:10;width:270px;background:#fff;border:1px solid #9aa5b0;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.25);line-height:1.4;cursor:default;padding:.5rem}
.pop input{width:100%;padding:.4rem .5rem;border:1px solid #c5ccd2;border-radius:4px;margin-bottom:.4rem}
.pop ul{list-style:none;margin:0;padding:0;max-height:240px;overflow:auto}
.pop li{padding:.3rem .45rem;border-radius:3px;cursor:pointer;font-size:.9rem}
.pop li:hover,.pop li.sel{background:#e3edf7}
.pop li small{color:#5b6570}
.pop li.star::before{content:"★ ";color:#c28a00}
.pop .row{display:flex;justify-content:space-between;align-items:center;margin-top:.3rem}
.pop .row a{font-size:.85rem;color:#2f5d8c;cursor:pointer}
.pop .who{font-weight:600;margin-bottom:.3rem}
#tags{margin-top:.8rem}
#tags span{display:inline-block;background:#fff;border:1px solid #d5dade;border-radius:999px;padding:.1rem .6rem;margin:0 .3rem .3rem 0;font-size:.85rem}
#tags span a{color:#a33;cursor:pointer;margin-left:.3rem;text-decoration:none}
#empty{color:#5b6570;padding:2rem 0}
@media(max-width:800px){main{flex-direction:column}aside{width:auto;height:36vh;border-right:0;border-bottom:1px solid #d5dade}}
</style></head>
<body>
<header>
  <h1>Photo tagger</h1>
  <span id="state"></span>
  <span class="sp"></span>
  <button class="btn" id="dl">Download tags.json</button>
</header>
<main>
  <aside>
    <div class="bar">
      <input id="q" type="search" placeholder="Search photos or names…">
      <select id="flt">
        <option value="group">Group photos (2+ people linked)</option>
        <option value="all">All photos</option>
        <option value="todo">Not tagged yet</option>
        <option value="done">Tagged</option>
      </select>
    </div>
    <div id="list"></div>
  </aside>
  <section>
    <p id="help">Click a face, or click and drag outwards to draw a ring that fits it, then choose who it is. Click a ring to see the name or remove it. Arrow keys move between photos.</p>
    <div class="nav"><button class="btn alt" id="prev">← Previous</button><button class="btn alt" id="next">Next →</button><span id="title"></span></div>
    <div id="stage"></div>
    <div id="tags"></div>
    <div id="empty" hidden>No photos match this filter.</div>
  </section>
</main>
<script>
var D = __DATA__;
var DIR = D.dir.replace(/\/$/, '');
var people = D.people, byId = {};
people.forEach(function (p) { byId[p.id] = p; p.lc = p.name.toLowerCase(); });
var photos = D.photos;
var DRAFT = 'photo-tagger-draft';

function hash(str) { var h = 5381; for (var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return String(h); }
var baseJSON = JSON.stringify(D.tags), base = hash(baseJSON);
var tags = JSON.parse(baseJSON), dirty = false;
try {
  var d = JSON.parse(localStorage.getItem(DRAFT) || 'null');
  if (d && d.base === base) { tags = d.tags; dirty = !!d.dirty; }
} catch (e) {}

var cur = null, curKey = null, pop = null;
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function save() {
  dirty = true;
  try { localStorage.setItem(DRAFT, JSON.stringify({ base: base, tags: tags, dirty: true })); } catch (e) {}
  state();
}
function state() {
  var n = 0, ph = 0;
  Object.keys(tags).forEach(function (k) { if (tags[k].length) { ph++; n += tags[k].length; } });
  var el = $('state');
  el.textContent = n + ' face' + (n === 1 ? '' : 's') + ' tagged in ' + ph + ' photo' + (ph === 1 ? '' : 's') +
    (dirty ? ' · not yet downloaded' : '');
  el.className = dirty ? 'dirty' : '';
}
function tagsOf(k) { return tags[k] || (tags[k] = []); }

function visible() {
  var q = $('q').value.toLowerCase().trim(), f = $('flt').value;
  return photos.filter(function (p) {
    var n = (tags[p.key] || []).length;
    var extra = (tags[p.key] || []).filter(function (x) { return p.att.indexOf(x.id) < 0; }).length;
    if (f === 'group' && p.att.length + extra < 2) return false;
    if (f === 'todo' && n) return false;
    if (f === 'done' && !n) return false;
    if (!q) return true;
    var hay = (p.title + ' ' + p.key + ' ' + p.att.concat((tags[p.key] || []).map(function (t) { return t.id; }))
      .map(function (id) { return byId[id] ? byId[id].name : ''; }).join(' ')).toLowerCase();
    return q.split(/\s+/).every(function (w) { return hay.indexOf(w) > -1; });
  });
}
var shown = [];
function renderList() {
  shown = visible();
  var box = $('list'); box.innerHTML = '';
  shown.slice(0, 400).forEach(function (p) {
    var n = (tags[p.key] || []).length;
    var names = p.att.slice(0, 3).map(function (id) { return byId[id] ? byId[id].name : ''; }).filter(Boolean).join(', ');
    var d = document.createElement('div');
    d.className = 'it' + (p.key === curKey ? ' cur' : '');
    d.innerHTML = '<img loading="lazy" src="' + DIR + '/media/thumb/' + encodeURI(p.name) + '" alt="">' +
      '<div class="t"><b>' + esc(p.title || p.key) + '</b><span>' + esc(names || 'no people linked') + '</span></div>' +
      (n ? '<span class="n">' + n + '</span>' : '');
    d.onclick = function () { open(p.key); };
    box.appendChild(d);
  });
  if (shown.length > 400) { var m = document.createElement('div'); m.className = 'it'; m.textContent = 'Showing the first 400 — use search to narrow.'; box.appendChild(m); }
  $('empty').hidden = shown.length > 0 || !!curKey;
}

function closePop() { if (pop) { pop.remove(); pop = null; } }
function open(key) {
  closePop(); curKey = key;
  cur = photos.filter(function (p) { return p.key === key; })[0];
  if (!cur) return;
  $('title').textContent = cur.title || cur.key;
  var st = $('stage'); st.innerHTML = '';
  var img = new Image(); img.draggable = false;
  img.src = DIR + '/media/web/' + encodeURI(cur.name);
  st.appendChild(img);
  st.onpointerdown = function (e) {
    if (e.button || (e.target.closest && (e.target.closest('.pop') || e.target.closest('.mk')))) return;
    e.preventDefault(); closePop();
    var r = img.getBoundingClientRect(), x0 = e.clientX, y0 = e.clientY;
    var fx = (x0 - r.left) / r.width, fy = (y0 - r.top) / r.height;
    var ring = document.createElement('span'); ring.className = 'mk draft';
    ring.style.left = fx * 100 + '%'; ring.style.top = fy * 100 + '%'; ring.style.display = 'none';
    st.appendChild(ring);
    function rad(ev) { return Math.hypot(ev.clientX - x0, ev.clientY - y0) / r.width; }
    function move(ev) {
      var d = rad(ev);
      if (d * r.width > 6) { ring.style.display = 'block'; ring.style.width = Math.max(0.016, d * 2) * 100 + '%'; }
    }
    function up(ev) {
      document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up);
      var d = rad(ev); ring.remove();
      chooser(fx, fy, d * r.width > 6 ? Math.min(0.3, d) : 0.03);
    }
    document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);
  };
  st.style.touchAction = 'none';
  draw();
  renderList();
}
function draw() {
  var st = $('stage');
  [].slice.call(st.querySelectorAll('.mk')).forEach(function (m) { m.remove(); });
  tagsOf(curKey).forEach(function (t, i) {
    var m = document.createElement('span');
    m.className = 'mk'; m.style.left = t.x * 100 + '%'; m.style.top = t.y * 100 + '%'; m.style.width = (t.r || 0.03) * 200 + '%';
    m.title = t.name; m.dataset.i = i;
    m.onclick = function (e) { e.stopPropagation(); marker(i, m); };
    st.appendChild(m);
  });
  var box = $('tags'); box.innerHTML = '';
  tagsOf(curKey).forEach(function (t, i) {
    var s = document.createElement('span');
    s.innerHTML = esc(t.name) + '<a title="Remove this tag">✕</a>';
    s.onmouseenter = function () { var m = st.querySelector('.mk[data-i="' + i + '"]'); if (m) m.classList.add('hot'); };
    s.onmouseleave = function () { var m = st.querySelector('.mk[data-i="' + i + '"]'); if (m) m.classList.remove('hot'); };
    s.querySelector('a').onclick = function () { tagsOf(curKey).splice(i, 1); save(); draw(); renderList(); };
    box.appendChild(s);
  });
}
function place(el, fx, fy) {
  var st = $('stage'); st.appendChild(el);
  var w = st.clientWidth, left = fx * w + 14, top = fy * st.clientHeight + 14;
  if (left + 280 > w) left = Math.max(0, fx * w - 284);
  el.style.left = left + 'px'; el.style.top = top + 'px';
}
function marker(i, m) {
  closePop();
  var t = tagsOf(curKey)[i];
  pop = document.createElement('div'); pop.className = 'pop';
  pop.innerHTML = '<div class="who">' + esc(t.name) + '</div><div class="row"><a id="rm">Remove tag</a><a id="cl">Close</a></div>';
  place(pop, t.x, t.y);
  pop.querySelector('#rm').onclick = function () { tagsOf(curKey).splice(i, 1); closePop(); save(); draw(); renderList(); };
  pop.querySelector('#cl').onclick = closePop;
}
function chooser(fx, fy, fr) {
  closePop();
  pop = document.createElement('div'); pop.className = 'pop';
  pop.innerHTML = '<input type="search" placeholder="Type a name…" autocomplete="off"><ul></ul>' +
    '<div class="row"><span></span><a id="cl">Cancel</a></div>';
  place(pop, fx, fy);
  var inp = pop.querySelector('input'), ul = pop.querySelector('ul'), sel = 0, opts = [];
  var linked = {}; cur.att.forEach(function (id) { linked[id] = 1; });
  function fill() {
    var q = inp.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
    var m = people.filter(function (p) { return q.every(function (w) { return p.lc.indexOf(w) > -1; }); });
    m.sort(function (a, b) { return (linked[b.id] ? 1 : 0) - (linked[a.id] ? 1 : 0); });
    opts = m.slice(0, 40); sel = 0; ul.innerHTML = '';
    opts.forEach(function (p, i) {
      var li = document.createElement('li');
      li.className = (linked[p.id] ? 'star ' : '') + (i === 0 ? 'sel' : '');
      li.innerHTML = esc(p.name) + (p.yrs ? ' <small>' + esc(p.yrs) + '</small>' : '');
      li.onclick = function () { pick(p); };
      ul.appendChild(li);
    });
    if (!opts.length) ul.innerHTML = '<li><small>No one matches.</small></li>';
  }
  function pick(p) {
    tagsOf(curKey).push({ id: p.id, name: p.name, x: Math.round(fx * 10000) / 10000, y: Math.round(fy * 10000) / 10000, r: Math.round(fr * 10000) / 10000 });
    closePop(); save(); draw(); renderList();
  }
  function mark() { [].forEach.call(ul.children, function (li, i) { li.classList.toggle('sel', i === sel); if (i === sel) li.scrollIntoView({ block: 'nearest' }); }); }
  inp.addEventListener('input', fill);
  inp.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { sel = Math.min(opts.length - 1, sel + 1); mark(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); mark(); e.preventDefault(); }
    else if (e.key === 'Enter' && opts[sel]) { pick(opts[sel]); e.preventDefault(); }
    else if (e.key === 'Escape') { closePop(); }
    e.stopPropagation();
  });
  pop.querySelector('#cl').onclick = closePop;
  fill(); inp.focus();
}

function step(d) {
  if (!shown.length) return;
  var i = shown.findIndex(function (p) { return p.key === curKey; });
  open(shown[(i + d + shown.length) % shown.length].key);
}
$('prev').onclick = function () { step(-1); };
$('next').onclick = function () { step(1); };
document.addEventListener('keydown', function (e) {
  if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'Escape') closePop();
});
$('q').addEventListener('input', renderList);
$('flt').addEventListener('change', function () { renderList(); if (shown.length && !shown.some(function (p) { return p.key === curKey; })) open(shown[0].key); });

$('dl').onclick = function () {
  var out = { photos: {} };
  photos.forEach(function (p) {
    var t = tags[p.key];
    if (t && t.length) out.photos[p.key] = t.map(function (x) { return { id: x.id, name: x.name, x: x.x, y: x.y, r: x.r || 0.03 }; });
  });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' }));
  a.download = 'tags.json'; document.body.appendChild(a); a.click(); a.remove();
  dirty = false;
  try { localStorage.setItem(DRAFT, JSON.stringify({ base: base, tags: tags, dirty: false })); } catch (e) {}
  state();
  alert('Saved as tags.json in your Downloads folder.\n\nMove it into your genealogy-site folder (replace the old tags.json), then run the build again.');
};
window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

state(); renderList();
if (shown.length) open(shown[0].key); else $('empty').hidden = false;
</script>
</body></html>
